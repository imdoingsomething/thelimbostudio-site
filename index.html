<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Limbo Studio</title>
<meta name="description" content="Independent technical exploration. Building things that are useful. Minneapolis, MN."/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;background:#1e1e2e;overflow:hidden}
body{
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace;
  font-size:14px;line-height:1.8;
  color:#cdd6f4;
}
#shell{
  width:min(860px,100vw);
  height:100vh;
  padding:clamp(24px,4vw,64px) clamp(20px,4vw,56px);
  display:flex;flex-direction:column;
}
#output{
  flex:1;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:#313244 transparent;
}
#output::-webkit-scrollbar{width:3px}
#output::-webkit-scrollbar-thumb{background:#313244}

.ln{display:block;white-space:pre-wrap;word-break:break-word;min-height:1.8em}
.logo-row{display:block;min-height:0;margin-bottom:4px;padding-top:4px;}

/* catppuccin mocha token colors */
.fg      { color:#cdd6f4 }   /* base text */
.comment { color:#6c7086 }   /* overlay0 — comments */
.subtext { color:#a6adc8 }   /* subtext1 */
.purple  { color:#cba6f7 }   /* mauve — keywords */
.teal    { color:#94e2d5 }   /* teal — strings / values */
.green   { color:#a6e3a1 }   /* green — success */
.blue    { color:#89b4fa }   /* blue — functions */
.sky     { color:#89dceb }   /* sky — types */
.peach   { color:#fab387 }   /* peach — constants */
.red     { color:#f38ba8 }   /* red — errors */
.yellow  { color:#f9e2af }   /* yellow — warnings */
.bright  { color:#ffffff }   /* white */

.prompt-row{
  display:flex;align-items:center;
  margin-top:8px;flex-shrink:0;
  position:relative;
}
.sigil{color:#cba6f7;margin-right:6px;flex-shrink:0;user-select:none;font-weight:500}
#inp{
  background:transparent;border:none;outline:none;
  font-family:inherit;font-size:14px;
  color:#cdd6f4;flex:1;caret-color:#f5c2e7;min-width:0;
}
#caret{
  width:2px;height:16px;background:#f5c2e7;
  display:inline-block;vertical-align:middle;
  animation:blink 1.2s step-end infinite;
  flex-shrink:0;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

#ac{
  display:none;position:absolute;
  bottom:calc(100% + 4px);left:22px;
  background:#181825;
  border:1px solid #313244;
  border-radius:4px;z-index:10;
  min-width:260px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.aci{
  padding:5px 14px;font-size:13px;cursor:pointer;
  color:#cdd6f4;display:flex;align-items:center;gap:0;
}
.aci:hover,.aci.sel{background:#313244}
.aci .aslash{color:#cba6f7;margin-right:2px}
.aci .acmd{color:#89b4fa}
.aci .adesc{color:#6c7086;font-size:11px;margin-left:auto;padding-left:16px}
</style>
</head>
<body>
<div id="shell">
  <div id="output"></div>
  <div class="prompt-row">
    <span class="sigil">λ</span>
    <input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
    <span id="caret"></span>
    <div id="ac"></div>
  </div>
</div>
<script>
const O=document.getElementById('output');
const I=document.getElementById('inp');
const AC=document.getElementById('ac');

const CMDS=[
  {c:'projects',d:'active work'},
  {c:'about',   d:'who we are'},
  {c:'contact', d:'reach out'},
  {c:'stance',  d:'open stanceapp.org'},
  {c:'github',  d:'open github'},
  {c:'clear',   d:'clear buffer'},
  {c:'help',    d:'show commands'},
];

// each line: [colorClass, text]
const PAGES={
  help:[
    ['purple','-- commands -----------------------------------------------'],
    ['fg',''],
    ['blue',  '  /projects   '],['comment','active work'],
    ['blue',  '  /about      '],['comment','who we are'],
    ['blue',  '  /contact    '],['comment','reach out'],
    ['blue',  '  /stance     '],['comment','open stanceapp.org'],
    ['blue',  '  /github     '],['comment','open github'],
    ['blue',  '  /clear      '],['comment','clear the buffer'],
    ['fg',''],
    ['comment','-- tab to autocomplete, enter to run -----------------------'],
  ],
  projects:[
    ['purple','-- projects ------------------------------------------------'],
    ['fg',''],
    ['peach', 'stance'],
    ['fg',    'a web platform for structured argument annotation. users paste or'],
    ['fg',    'link a source, select passages, tag fallacy types, and write'],
    ['fg',    'counter-positions. each analysis produces a shareable artifact.'],
    ['fg',    'ai scores submissions via user-supplied api keys.'],
    ['comment','stack: fastapi · sqlite/postgres · react + vite · playwright'],
    ['comment','       docker compose · caddy · ollama (local inference)'],
    ['green', 'status: live   →   stanceapp.org'],
    ['fg',''],
    ['peach', 'discipline'],
    ['fg',    'a modular ux framework for ai-assisted coding targeting senior'],
    ['fg',    'engineers. replaces the chat+diff panel model with intent-first'],
    ['fg',    'workspaces, a temporal causality view of ai reasoning, and a'],
    ['fg',    'confidence topology layer showing where the model is guessing.'],
    ['comment','stack: open spec + plugin api · community workspace registry'],
    ['comment','       designed to wrap existing editors (neovim, vscode, zed)'],
    ['blue',  'status: in build'],
    ['fg',''],
    ['peach', 'grey duck'],
    ['fg',    'a private group communication system for closed organizations.'],
    ['fg',    'non-federated — no external server connections, no data leaving'],
    ['fg',    'the host. built on matrix/synapse with federation disabled.'],
    ['fg',    'end-to-end encrypted rooms, invite-only, self-administered.'],
    ['comment','stack: matrix/synapse · self-hosted on hetzner · njalla domains'],
    ['comment','       federation disabled · e2ee · no commercial dependency'],
    ['sky',   'status: active   not public yet'],
  ],
  about:[
    ['purple','-- about ---------------------------------------------------'],
    ['fg',''],
    ['fg',    'technical exploration with a systems improvement background.'],
    ['fg',    'focused on novel implementations of existing services and'],
    ['fg',    'platforms — finding the non-obvious use of what already exists.'],
    ['fg',''],
    ['fg',    'some of it is serious. some of it is just messing around.'],
    ['fg',''],
    ['comment','location        minneapolis, mn'],
    ['comment','infrastructure  self-hosted / hetzner dedicated'],
    ['comment','open to         collaboration, research, press'],
  ],
  contact:[
    ['purple','-- contact -------------------------------------------------'],
    ['fg',''],
    ['fg',    'if the work resonates, reach out.'],
    ['fg',''],
    ['comment','email   contact@thelimbostudio.com'],
    ['comment','github  github.com/imdoingsomething'],
    ['comment','stance  stanceapp.org'],
  ],
};

let inlineNext=false;

function line(cls,txt){
  if(inlineNext){
    const last=O.lastElementChild;
    if(last){const s=document.createElement('span');s.className=cls;s.textContent=txt;last.appendChild(s);O.scrollTop=O.scrollHeight;inlineNext=false;return last;}
  }
  const el=document.createElement('div');
  el.className='ln';
  const s=document.createElement('span');s.className=cls;s.textContent=txt;
  el.appendChild(s);O.appendChild(el);O.scrollTop=O.scrollHeight;
  return el;
}

function blank(){line('fg','');}

function typeLines(pairs,done){
  let i=0;
  function next(){
    if(i>=pairs.length){if(done)done();return;}
    const [cls,txt]=pairs[i++];
    line(cls,txt);
    setTimeout(next, txt===''?20:30);
  }
  next();
}

function renderPage(pairs){
  blank();
  typeLines(pairs);
}

function execCmd(raw){
  const cmd=raw.trim().replace(/^\//,'').toLowerCase();
  if(!cmd)return;
  const el=document.createElement('div');el.className='ln';
  const sig=document.createElement('span');sig.className='sigil';sig.textContent='λ ';
  const tx=document.createElement('span');tx.className='purple';tx.textContent=(raw.startsWith('/')?raw:'/'+cmd);
  el.appendChild(sig);el.appendChild(tx);O.appendChild(el);O.scrollTop=O.scrollHeight;

  if(cmd==='clear'){O.innerHTML='';return;}
  if(cmd==='stance'){blank();line('green','opening stanceapp.org...');setTimeout(()=>window.open('https://stanceapp.org','_blank'),300);return;}
  if(cmd==='github'){blank();line('green','opening github.com/imdoingsomething...');setTimeout(()=>window.open('https://github.com/imdoingsomething','_blank'),300);return;}
  if(PAGES[cmd]){renderPage(PAGES[cmd]);return;}
  blank();
  line('red','E: unknown command: /'+cmd);
  line('comment','type /help for available commands');
}

// autocomplete
let acIdx=-1,acList=[];
function drawAC(val){
  if(!val.startsWith('/')){AC.style.display='none';acIdx=-1;return;}
  const q=val.slice(1).toLowerCase();
  acList=CMDS.filter(x=>x.c.startsWith(q));
  if(!acList.length){AC.style.display='none';acIdx=-1;return;}
  AC.innerHTML=acList.map((x,i)=>`<div class="aci${i===acIdx?' sel':''}" data-i="${i}"><span class="aslash">/</span><span class="acmd">${x.c}</span><span class="adesc">${x.d}</span></div>`).join('');
  AC.style.display='block';
  AC.querySelectorAll('.aci').forEach(el=>el.addEventListener('mousedown',e=>{
    e.preventDefault();I.value='/'+acList[+el.dataset.i].c;AC.style.display='none';I.focus();
  }));
}

I.addEventListener('input',()=>{acIdx=-1;drawAC(I.value);});
I.addEventListener('keydown',e=>{
  if(AC.style.display!=='none'){
    if(e.key==='ArrowDown'){e.preventDefault();acIdx=Math.min(acIdx+1,acList.length-1);drawAC(I.value);return;}
    if(e.key==='ArrowUp'){e.preventDefault();acIdx=Math.max(acIdx-1,0);drawAC(I.value);return;}
    if(e.key==='Tab'){e.preventDefault();const p=acList[acIdx>=0?acIdx:0];if(p){I.value='/'+p.c;AC.style.display='none';}return;}
    if(e.key==='Escape'){AC.style.display='none';acIdx=-1;return;}
  }
  if(e.key==='Enter'){const v=I.value.trim();I.value='';AC.style.display='none';acIdx=-1;if(v)execCmd(v);}
});
document.addEventListener('click',()=>I.focus());

// boot — logo first, then text sequence
function boot(){
  const logoRow=document.createElement('div');
  logoRow.className='logo-row';
  const img=document.createElement('img');
  img.src='/assets/logo.png';
  img.alt='The Limbo Studio';
  img.style.cssText='width:72px;height:72px;display:block;opacity:0.92;image-rendering:crisp-edges;';
  logoRow.appendChild(img);
  O.appendChild(logoRow);

  const BOOT=[
    ['comment','-- limbo-studio v1.0.0 (2026-03-22) -----------------------'],
    ['fg',''],
    ['bright', 'THE LIMBO STUDIO'],
    ['comment','minneapolis  ·  independent  ·  2026'],
    ['fg',''],
    ['teal',   'Building things that are useful.'],
    ['fg',''],
    ['subtext','type / to navigate'],
    ['comment','press tab to autocomplete   /help for all commands'],
    ['fg',''],
    ['comment','------------------------------------------------------------'],
    ['fg',''],
  ];
  typeLines(BOOT,()=>I.focus());
}

boot();
</script>
</body>
</html>
